
[[keyboard.bindings]]
action = "ResetFontSize"
key = "Left"
mods = "Control"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Right"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Up"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Down"
mods = "Control"

[general]
live_config_reload = true
working_directory = "None"

[terminal]

# Palette copied from kitty's stylix theme (~/.config/kitty/theme.conf)
[colors.bright]
black = "#08052B"
red = "#FF7F7F"
green = "#7F5DBF"
yellow = "#CC3980"
blue = "#7FBAFF"
magenta = "#7F3FBF"
cyan = "#7F7FFF"
white = "#CDCEDB"

[colors.normal]
black = "#08052B"
red = "#FF7F7F"
green = "#7F5DBF"
yellow = "#CC3980"
blue = "#7FBAFF"
magenta = "#7F3FBF"
cyan = "#7F7FFF"
white = "#CDCEDB"

[colors.primary]
background = "#08052B"
foreground = "#E3E3EA"

[colors.cursor]
cursor = "#E3E3EA"
text = "#08052B"

[colors.selection]
background = "#08052B"
foreground = "#FFFFFF"

[cursor]
thickness = 0.15
unfocused_hollow = false

[cursor.style]
blinking = "Always"
shape = "Underline"

[env]
TERM = "alacritty"

[font]
size = 13

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"


[scrolling]
history = 100000
multiplier = 3

[terminal.shell]
program = "/home/esc2/.scripts/zsh-launcher"

[window]
opacity = 0.9

[keyboard]
