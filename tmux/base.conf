# Shared tmux options + bindings (no plugins, no server-lifecycle policy).
# Sourced by ../tmux.conf (local profile) and orca.conf (orca -L socket).

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g status-keys vi
set -g mode-keys vi
set -g mouse on

# (aka last modified last window or client)
bind-key m last-window
bind-key M switch-client -l

# Resize
bind H resize-pane -L 25
bind J resize-pane -D 25
bind K resize-pane -U 25
bind L resize-pane -R 25

# Kill
unbind x
bind x kill-pane
bind q kill-window
bind Q kill-session

unbind %
bind h split-window -h -c "#{pane_current_path}"
unbind '"'
bind v split-window -v -c "#{pane_current_path}"

# Auto renumber windows on close
set-option -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# only show status bar if there is more then one window
set -g status off
set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

# Configure windows status to pwd
# https://that.guru/blog/automatically-set-tmux-window-name/
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename on

set -gq allow-passthrough on

# Per-pane title line on the top border: index, running command and the cwd.
# The home dir is collapsed to ~ and the path is truncated to its last ~27
# chars (keeping the leading ~) so deep paths stay short. Non-home paths are
# shown verbatim (also truncated). Doubles as the status line for panes
# collapsed by the auto-hide plugin.
set -g pane-border-status off
set -g pane-border-format '#{?pane_active,#[reverse],} #{pane_index}:#{pane_current_command} #{?#{m:/home/*,#{pane_current_path}},~#{=/-27/…:#{s|^/home/[^/]+||:pane_current_path}},#{=/-30/…:pane_current_path}} #[default]'
# ...but only when the window is actually split ([1] avoids clobbering the
# window-layout-changed hook above; layout-changed covers splits, kills, joins)
set-hook -g after-split-window[1] 'setw pane-border-status top'
set-hook -g window-layout-changed[1] 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

set -g status-style bg=default
