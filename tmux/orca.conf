# Orca profile — separate server (tmux -L orca -f this-file), started by
# _orca_tmux in ../zshrc. Shares base options/bindings with the local
# profile; runs a minimal plugin set directly (no tpm: tpm only greps
# ~/.tmux.conf for @plugin lines, and the full set — sessionx, resurrect,
# continuum — must not touch orca sessions).

source-file ~/.dotfiles/tmux/base.conf

# Reload this profile, not ~/.tmux.conf
bind R source-file ~/.dotfiles/tmux/orca.conf

# If a grouped session is killed externally, the client must exit — never
# hop to another session, or orca keystrokes silently retarget it.
# (Global here; the local profile keeps `off` for sessionx hopping.)
set -g detach-on-destroy on

# Plugins are installed by the local server's tpm under ~/.tmux/plugins;
# options before run-shell — plugins read them at load
set -g @yank_selection_mouse 'clipboard'
set -g @yank_selection 'clipboard'
unbind :
set -g @thumbs-key t
run-shell '~/.tmux/plugins/tmux-yank/yank.tmux'
run-shell '~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux'
run-shell '~/.tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
