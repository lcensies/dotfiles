# Local profile (default server). Shared options/bindings live in
# tmux/base.conf; the orca -L socket uses tmux/orca.conf instead.
# @plugin lines must stay in THIS file: tpm greps ~/.tmux.conf only and
# does not follow source-file.

source-file ~/.dotfiles/tmux/base.conf

# Reload configuration
bind R source-file ~/.tmux.conf

# Session hopping on kill is fine locally (sessionx); the orca profile
# overrides this to `on`
set-option -g detach-on-destroy off

# Disabled due to conflicts under ssh
set -g @plugin 'jabirali/tmux-tilish'
set -g @tilish-default 'main-vertical'

