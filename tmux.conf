# Persistence across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
 # for vim
set -g @resurrect-strategy-vim 'session'
# No @resurrect-strategy-nvim here: the strategy lookup keys on the *first word*
# of the recorded command, which under the nixvim wrapper is a /nix/store path,
# so `@resurrect-strategy-<that path>` never resolves and the strategy is dead.
# nvim is handled by tmux_resurrect_run below, which loads the persistence.nvim
# session for the pane's cwd (LazyVim ships persistence.nvim).

# Editors and AI coding agents come back on the session they had, not a blank
# one. tmux_resurrect_run does the per-tool flag handling; see
# ~/.dotfiles/scripts/tmux_resurrect_run.
#
# nvim runs through the nixvim wrapper, so its recorded command is an absolute
# /nix/store path -- matched with the `~` (substring) form.
#
# opencode is aliased to the llm redactor wrapper and is likewise recorded by
# absolute path, so it is restored as a bare word for the interactive shell to
# expand the alias again.
#
# pi goes through the nix wrapper too, so its recorded command is the absolute
# /nix/store path as well -- the old bare `pi` match never fired. The `cpi`
# alias (`workmux --profile corp exec pi`) execs that same binary, so a saved
# pane cannot say which one it was: tmux_resurrect_run picks by cwd.
#
# `llm-redactor-exec -- pi` keeps the redactor as the pane's process, so that
# form is matched separately and restored with the redactor still wrapping it.
set -g @resurrect-processes '"nvim->tmux_resurrect_run nvim" "~bin/nvim->tmux_resurrect_run nvim" "claude->tmux_resurrect_run claude *" "~libexec/pi/pi->tmux_resurrect_run pi *" "~llm-redactor-exec -- pi->llm-redactor-exec -- tmux_resurrect_run pi *" "~bin/opencode->opencode --continue"'

# vimium-like shortcuts for copying
set -g @plugin 'fcsonline/tmux-thumbs'
unbind :
set -g @thumbs-key t

# vimium-like shortuts for jumping
set -g @plugin 'schasse/tmux-jump'

# Navigation between vim and tmux panes with Ctrl + HJKL
# TODO: add pane close with Ctrl+X
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'omerxx/tmux-sessionx'
# Requires bat installed
unbind s
set -g @sessionx-bind 's'

# TODO: identify why xdg-open didn't work
# Ctrl+o -> open in text editor
unbind o
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open 'o'

# Command palette (prefix+p, bound after tpm below).
# @palette-key must stay 'off': the plugin's own default is a NO-PREFIX
# C-Space binding, which is this config's prefix.
# Needs bun (nixos/common/default.nix); without it the plugin no-ops.
set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'off'

run '~/.tmux/plugins/tpm/tpm'

# Local plugin: auto-hide (vertical zoom toggle). Must run AFTER tpm:
# tilish sets after-split-window unindexed, which wipes the whole hook
# array including auto-hide's after-split-window[2].
run '~/.tmux/plugins/auto-hide/auto-hide.tmux'

# prefix+o -> follow a log path printed in this pane (pi unified-exec prints
# log_path: for every command) in a popup with `less +F`. After tpm: the
# `unbind o` above runs before plugins load, and tmux-open only binds in
# copy-mode, so the root prefix key is free.
bind-key o run-shell -b '~/.dotfiles/scripts/tmux_log_open "#{pane_id}"'

# tilish binds root M-t -> tiled; a stray Alt+t flips the window to grid
# and the tilish enforce hooks keep re-applying it. Must run after tpm.
unbind -T root M-t

# tilish's M-Enter selects the bottom-right pane and splits it, but auto-hide
# may have collapsed that pane to a single line -> "no space for new pane"
# (the expand hook runs async and loses the race). Split full-width instead;
# the tilish after-split hook folds the new pane into main-vertical anyway.
bind -n M-Enter split-window -fv -c "#{pane_current_path}"

# tilish re-applies main-vertical on every split (after-split-window hook),
# which resizes the workmux sidebar pane to the layout's half-screen split.
# Reflow the sidebar after any layout change so it snaps back to its
# configured width (sidebar.width in ~/.config/workmux/config.yaml).
set-hook -g after-select-layout 'run-shell -b "workmux _sidebar-reflow --window #{window_id}"'

# prefix+p -> command palette (was tmux's stock previous-window; window hopping
# here is m/M and tilish's Alt-digits). After tpm so nothing re-binds over it.
# Items under the `workmux` category come from ~/.config/tmux-palette/.
unbind p
bind p run-shell "~/.tmux/plugins/tmux-palette/bin/tmux-palette.sh"
